<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Resonate — a personal atlas</title>
<meta name="description" content="Save the places that resonate with you. A local-first personal atlas and a quiet trust network: hand your atlas to people whose taste you trust.">
<meta name="theme-color" content="#EFF1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191423" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="css/style.css?v=rf3">
</head>
<body class="boot">

<div id="app" class="app">
  <div id="map" aria-label="The field — a map of your saved places"></div>

  <!-- the four corner marks: the only chrome that exists at rest -->
  <button class="fm fm-nw" id="fmIndex" aria-label="Open the index">
    Resonate<span class="fm-count mono" id="placeCount"></span>
  </button>
  <button class="fm fm-s" id="fmCommand" aria-label="Search, add, or command">
    anywhere<kbd class="mono">/</kbd>
  </button>
  <output class="fm fm-se mono" id="coordsReadout" aria-live="off"></output>
  <div class="fm fm-sw mono">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a> · <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a></div>

  <!-- long-press / right-click add proposal -->
  <button class="add-confirm" id="addConfirm" hidden>
    <span id="addConfirmName">…</span>
    <small class="mono" id="addConfirmCoords"></small>
    <em>add ↵</em>
  </button>
</div>

<!-- the index: a summoned poster -->
<section class="index" id="indexOverlay" hidden aria-label="Index of places">
  <button class="index-x" id="indexClose">close</button>
  <header class="index-head">
    <h1 class="index-count"><span id="ixN">0</span><small>places</small></h1>
    <nav class="index-go" id="indexGo" aria-label="Go to">
      <button data-go="folio">folio</button>
      <button data-go="newsstand">newsstand</button>
      <button data-go="voices">voices</button>
      <button data-go="census">census</button>
      <button data-go="kept">kept</button>
      <button data-go="keys">keys</button>
    </nav>
    <div class="index-line" id="statusSeg" role="tablist" aria-label="Status">
      <button data-status="all" aria-pressed="true">all</button>
      <button data-status="visited" aria-pressed="false">been</button>
      <button data-status="wishlist" aria-pressed="false">want to go</button>
    </div>
    <div class="index-line" id="filterChips" aria-label="Tags"></div>
    <div class="index-line ix-sorts" id="sortLine" aria-label="Arrange">
      <button data-sort="recent" aria-pressed="true">newest</button>
      <button data-sort="name" aria-pressed="false">a–z</button>
      <button data-sort="distance" aria-pressed="false">nearest</button>
      <button data-sort="rating" aria-pressed="false">rated</button>
    </div>
  </header>
  <div class="index-list" id="listView" role="list"></div>
</section>

<!-- the plate: a typographic column over a live map -->
<aside class="plate" id="plate" hidden aria-label="Place"></aside>

<!-- posters: census, kept (settings), correspondence, keys -->
<section class="poster" id="statsOverlay" hidden aria-label="The census">
  <header class="poster-head"><h1 class="poster-word">census</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="statsBody"></div>
</section>
<section class="poster" id="settingsOverlay" hidden aria-label="Kept">
  <header class="poster-head"><h1 class="poster-word">kept</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="settingsBody"></div>
</section>
<section class="poster" id="corrOverlay" hidden aria-label="Correspondence">
  <header class="poster-head"><h1 class="poster-word">voices</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="corrBody"></div>
</section>
<section class="poster" id="keysOverlay" hidden aria-label="Keys">
  <header class="poster-head"><h1 class="poster-word">keys</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="keysBody"></div>
</section>

<!-- the resonance report: opening someone's atlas -->
<section class="report" id="reportOverlay" hidden aria-label="Resonance report"></section>

<!-- the folio composer: a slice, a title, a dedication -->
<section class="poster" id="folioOverlay" hidden aria-label="Compose a folio">
  <header class="poster-head"><h1 class="poster-word">folio</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="folioBody"></div>
</section>

<!-- the newsstand: published folios, ranked by your own resonance -->
<section class="poster" id="newsOverlay" hidden aria-label="The newsstand">
  <header class="poster-head"><h1 class="poster-word">newsstand</h1><button class="poster-x" data-close>close</button></header>
  <div class="poster-body" id="newsBody"></div>
</section>

<!-- the command line -->
<div class="cmd" id="paletteOverlay" hidden>
  <div class="cmd-results" id="paletteResults" role="listbox"></div>
  <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" enterkeyhint="go"
    placeholder="anywhere — #tag  >verb  @voice" aria-label="Search, add, or command">
</div>

<div class="toast mono" id="toast" hidden></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="shootFile" accept="image/*" capture="environment" hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="vendor/lz/lz-string.min.js"></script>
<script type="module" src="js/app.js?v=rf3"></script>
</body>
</html>
