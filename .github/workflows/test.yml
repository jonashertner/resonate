name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: every module parses
        run: |
          for f in js/*.js sw.js; do node --check "$f" || exit 1; done
      - name: the invariants a hostile link must not break
        run: node --test test/*.test.mjs club/test/*.test.mjs
      - name: the vendored argon2 matches its committed digest
        run: cd vendor/argon2 && shasum -a 256 -c SHA256SUMS
      - name: no em-dash reaches a reader
        run: |
          if grep -rn '—' index.html SECURITY.md README.md THREATS.md METHOD.md COMMONS.md club/SPEC.md; then
            echo "an em-dash is in the page copy"
            exit 1
          fi

  # a parser cannot see a control a keyboard could not reach, a word pushed off
  # a narrow screen, or a shared place that left the device. this job can
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: the app, driven in three engines
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: what-the-browser-saw
          path: |
            playwright-report/
            test-results/
          retention-days: 7
