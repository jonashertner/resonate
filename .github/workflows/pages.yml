name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment already in flight: the pages service holds a
# per-site lock, and a cancelled run leaves that lock wedged
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage the site, without the repository's machinery
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # this site's deployments have been taking well past the action's
      # ten minute default, and were being aborted after they had succeeded
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1500000
