name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment already in flight: the pages service holds a
# per-site lock, and a cancelled run leaves that lock wedged
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage the site, without the repository's machinery
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # this site's deployments run past the action's ten minute ceiling and
      # land anyway, so the wait is allowed to give up and the site itself
      # is asked whether the commit arrived
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: wait until the site serves this build
        run: |
          mark=$(grep -oE 'v=rf[0-9]+' index.html | head -1)
          echo "looking for $mark"
          for i in $(seq 1 60); do
            if curl -fsS "https://jonashertner.github.io/resonate/?ci=$i" | grep -q "$mark"; then
              echo "live after $((i * 30))s"
              exit 0
            fi
            sleep 30
          done
          echo "the site never served $mark"
          exit 1
