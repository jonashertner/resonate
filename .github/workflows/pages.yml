name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment already in flight: the pages service holds a
# per-site lock, and a cancelled run leaves that lock wedged
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # nothing is published that has not passed its tests on this exact revision:
  # a green deploy used to mean only that the files went out
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: every module parses
        run: |
          for f in js/*.js sw.js; do node --check "$f" || exit 1; done
      - name: the invariants a hostile link must not break
        run: node --test test/*.test.mjs club/test/*.test.mjs
      - name: no em-dash reaches a reader
        run: |
          if grep -rn '—' index.html; then
            echo "an em-dash is in the page copy"
            exit 1
          fi

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage the site, without the repository's machinery
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' \
                --exclude '_site' --exclude 'test' --exclude 'node_modules' \
                --exclude 'club' \
                ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages cancels the deployment when its wait runs out, so the
      # wait is the whole truth: no continue-on-error, no polling afterwards
      # to paper over a deployment that is already dead.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

  # a separate job, so a green deploy that serves the wrong bytes still fails
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the site serves this build
        run: |
          mark=$(grep -oE 'v=rf[0-9]+' index.html | head -1)
          echo "looking for $mark"
          for i in $(seq 1 20); do
            body=$(curl -fsS "https://resonate.select/?ci=$i" || true)
            if printf '%s' "$body" | grep -q "$mark"; then
              echo "live after $((i * 15))s"
              exit 0
            fi
            sleep 15
          done
          echo "the site never served $mark"
          exit 1
      - name: the shell it needs is reachable
        run: |
          for p in css/style.css js/app.js js/schema.js sw.js assets/intro.mp4 manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://resonate.select/$p")
            echo "$p $code"
            [ "$code" = 200 ] || exit 1
          done
      - name: the repository's machinery is not published
        run: |
          for p in .git/config .github/workflows/pages.yml test/atlas.test.mjs .claude/launch.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://resonate.select/$p")
            echo "$p $code"
            [ "$code" = 404 ] || exit 1
          done
